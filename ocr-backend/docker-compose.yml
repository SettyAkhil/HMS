name: dpi-ocr-backend

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keppler
      POSTGRES_PASSWORD: keppler
      POSTGRES_DB: keppler
    ports:
      - "5433:5432"  # host 5432 already used by another local service (Coolify's postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keppler -d keppler"]
      interval: 5s
      timeout: 5s
      retries: 10

  hrms-postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: hospai-hrms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospai_enterprise
    ports:
      - "5434:5432"
    volumes:
      - hrms_postgres_data:/var/lib/postgresql/data
      - ../server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospai_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "7620:7620"
    environment:
      DATABASE_URL: postgresql+psycopg://keppler:keppler@postgres:5432/keppler
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # vLLM is published on host port 8700 (container vllm-qwen3vl8b). 8000
      # is another app on this machine, so every model call failed with
      # "Connection error" and summaries came back empty.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8700/v1}
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "7620"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    restart: unless-stopped
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://keppler:keppler@postgres:5432/keppler
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # vLLM is published on host port 8700 (container vllm-qwen3vl8b). 8000
      # is another app on this machine, so every model call failed with
      # "Connection error" and summaries came back empty.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8700/v1}
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Scale with: docker compose up -d --scale worker=4

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hrms_postgres_data:
