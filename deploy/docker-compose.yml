# HospAI -- complete production deployment (one command: ./deploy.sh up)
#
# Everything the hospital runs, in one Compose project. Only `web` is exposed
# (HTTP_PORT, default 80); every other service is reachable only on the
# private Docker network.
#
#   web (nginx)  -- the HMS app + the embedded Keppler OCR app, and the reverse
#                   proxy for every API path the browser uses:
#                     /hms-api/api/hr, /iclock  -> hrms        (Node HRMS server)
#                     /hms-api/*                -> gateway     (prefix stripped)
#                     /api/*                    -> ocr-api     (Keppler OCR backend)
#                     /vllm-api/*               -> AI_SERVER_URL (GPU model server)
#   gateway      -- nginx API gateway in front of the 9 Flask services + hr-api
#   postgres     -- main hospital database        (volume: main_postgres_data)
#   hr-postgres  -- HR database (tenant RLS)      (volume: hr_postgres_data)
#   ocr-postgres / ocr-redis / ocr-qdrant -- Keppler OCR data stores
#   hrms-postgres + hrms -- the Node HRMS server (legacy HR screens, eSSL devices)
#
# Configuration: deploy/.env (created by ./deploy.sh from deploy/.env.example).

name: hospai

x-backend-env: &backend-env
  DATABASE_URL: "postgresql://hospai:${MAIN_DB_PASSWORD}@postgres:5432/hospai"
  CORS_ALLOWED_ORIGINS: "${PUBLIC_URL}"
  SESSION_COOKIE_NAME: "hospai_session"
  SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
  SESSION_PEPPER: "${SESSION_PEPPER}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  SESSION_COOKIE_SAMESITE: "Lax"
  SEED_DEMO_USERS: "${SEED_DEMO_USERS:-true}"
  AI_PROVIDER: "vllm"
  VLLM_BASE_URL: "${AI_SERVER_URL:-http://host.docker.internal:8700}/v1"
  VLLM_MODEL: "${AI_MODEL:-qwen3-vl-8b}"
  VLLM_API_KEY: "${AI_API_KEY:-}"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  REDIS_URL: "redis://redis:6379/0"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
  TWILIO_WHATSAPP_FROM: "${TWILIO_WHATSAPP_FROM:-}"
  TWILIO_SMS_FROM: "${TWILIO_SMS_FROM:-}"
  TWILIO_MESSAGING_SERVICE_SID: "${TWILIO_MESSAGING_SERVICE_SID:-}"
  WHATSAPP_DEFAULT_COUNTRY_CODE: "${WHATSAPP_DEFAULT_COUNTRY_CODE:-+91}"
  SMS_DEFAULT_COUNTRY_CODE: "${SMS_DEFAULT_COUNTRY_CODE:-+91}"
  WHATSAPP_TEMPLATE_SIDS: "${WHATSAPP_TEMPLATE_SIDS:-}"
  # Patient document links go through the web server, which forwards
  # /hms-api/* to the gateway.
  PUBLIC_BASE_URL: "${PUBLIC_URL}/hms-api"
  PATIENT_DOCUMENT_LINK_TTL_HOURS: "${PATIENT_DOCUMENT_LINK_TTL_HOURS:-168}"
  SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY}"

x-backend-service: &backend-service
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ── Data stores ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospai
      POSTGRES_PASSWORD: "${MAIN_DB_PASSWORD}"
      POSTGRES_DB: hospai
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospai -d hospai"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging

  # ── Backend: 9 Flask services behind the gateway ─────────────────────────
  # auth-service creates/migrates the main database schema on start.
  auth-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/auth/Dockerfile }
    environment: { <<: *backend-env, PORT: "8011" }

  patients-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/patients/Dockerfile }
    environment: { <<: *backend-env, PORT: "8012" }
    volumes: [hospital_uploads:/app/uploads]
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started }, redis: { condition: service_started } }

  appointments-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/appointments/Dockerfile }
    environment: { <<: *backend-env, PORT: "8013" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  er-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/er/Dockerfile }
    environment: { <<: *backend-env, PORT: "8014" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  billing-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/billing/Dockerfile }
    environment: { <<: *backend-env, PORT: "8015" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  pharmacy-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/pharmacy/Dockerfile }
    environment: { <<: *backend-env, PORT: "8016" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  hr-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/hr/Dockerfile }
    environment: { <<: *backend-env, PORT: "8017" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  ai-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/ai/Dockerfile }
    environment: { <<: *backend-env, PORT: "8018" }
    volumes: [ai_model_cache:/home/appuser/.cache/huggingface]
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  reporting-service:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/reporting/Dockerfile }
    environment: { <<: *backend-env, PORT: "8019" }
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started } }

  celery-worker:
    <<: [*backend-service, *logging]
    build: { context: ../keppler-backend, dockerfile: backend/services/patients/Dockerfile }
    command: ["celery", "-A", "services.patients.app.celery", "worker", "--loglevel=info"]
    volumes: [hospital_uploads:/app/uploads]
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_started }, redis: { condition: service_started } }

  gateway:
    build: { context: ../keppler-backend, dockerfile: gateway/Dockerfile }
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      - auth-service
      - patients-service
      - appointments-service
      - er-service
      - billing-service
      - pharmacy-service
      - hr-service
      - hr-api
      - ai-service
      - reporting-service
    <<: *logging

  # ── HR & Workforce (FastAPI hr-api) ──────────────────────────────────────
  hr-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_owner
      POSTGRES_PASSWORD: "${HR_OWNER_DB_PASSWORD}"
      POSTGRES_DB: hospai_hr
    volumes: [hr_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_owner -d hospai_hr"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logging

  hr-api: &hr-api
    build: { context: ../keppler-backend/hr-api }
    restart: unless-stopped
    environment: &hr-env
      HR_DATABASE_URL: "postgresql+psycopg://hr_app:${HR_APP_DB_PASSWORD}@hr-postgres:5432/hospai_hr"
      HR_DATABASE_OWNER_URL: "postgresql+psycopg://hr_owner:${HR_OWNER_DB_PASSWORD}@hr-postgres:5432/hospai_hr"
      HR_APP_DB_PASSWORD: "${HR_APP_DB_PASSWORD}"
      HR_SECRETS_KEY: "${HR_SECRETS_KEY}"
      HR_AUTH_SERVICE_URL: "http://auth-service:8011"
      SESSION_COOKIE_NAME: "hospai_session"
      REDIS_URL: "redis://redis:6379/2"
      HR_TIMEZONE: "${HR_TIMEZONE:-Asia/Kolkata}"
      HR_GATEWAY_URL: "http://gateway:8010"
      HR_DOCUMENT_ROOT: "/data/hr-documents"
    volumes: [hr_documents:/data/hr-documents]
    depends_on:
      hr-postgres: { condition: service_healthy }
      redis: { condition: service_started }
      auth-service: { condition: service_started }
    <<: *logging

  hr-worker:
    <<: *hr-api
    command: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=INFO", "--concurrency=2"]
    depends_on: [hr-api]

  # ── Keppler OCR backend (FastAPI + Celery + Postgres + Redis + Qdrant) ───
  ocr-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keppler
      POSTGRES_PASSWORD: "${OCR_DB_PASSWORD}"
      POSTGRES_DB: keppler
    volumes: [ocr_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keppler -d keppler"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logging

  ocr-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *logging

  ocr-qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes: [ocr_qdrant_data:/qdrant/storage]
    <<: *logging

  # One-shot: creates/updates the OCR database schema before the API starts
  # (a fresh database otherwise answers 500 "relation users does not exist").
  ocr-migrate:
    build: { context: ../dpi-ocr-backend }
    environment: &ocr-env
      DATABASE_URL: "postgresql+psycopg://keppler:${OCR_DB_PASSWORD}@ocr-postgres:5432/keppler"
      REDIS_URL: "redis://ocr-redis:6379/0"
      CELERY_BROKER_URL: "redis://ocr-redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://ocr-redis:6379/0"
      QDRANT_URL: "http://ocr-qdrant:6333"
      VLLM_BASE_URL: "${AI_SERVER_URL:-http://host.docker.internal:8700}/v1"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      ocr-postgres: { condition: service_healthy }
    restart: "no"

  ocr-api:
    build: { context: ../dpi-ocr-backend }
    restart: unless-stopped
    environment: *ocr-env
    volumes: [ocr_uploads:/app/uploads]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "7620"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ocr-migrate: { condition: service_completed_successfully }
      ocr-redis: { condition: service_healthy }
      ocr-qdrant: { condition: service_started }
    <<: *logging

  ocr-worker:
    build: { context: ../dpi-ocr-backend }
    restart: unless-stopped
    environment: *ocr-env
    volumes: [ocr_uploads:/app/uploads]
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ocr-migrate: { condition: service_completed_successfully }
      ocr-redis: { condition: service_healthy }
    <<: *logging

  # ── Node HRMS server (legacy HR screens + eSSL biometric push) ───────────
  hrms-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: "${HRMS_DB_PASSWORD}"
      POSTGRES_DB: hospai_enterprise
    volumes: [hrms_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hospai_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logging

  hrms:
    build: { context: .., dockerfile: deploy/hrms/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HRMS_PORT: "8011"
      PGHOST: hrms-postgres
      PGPORT: "5432"
      PGDATABASE: hospai_enterprise
      PGUSER: hrms
      PGPASSWORD: "${HRMS_DB_PASSWORD}"
    depends_on:
      hrms-postgres: { condition: service_healthy }
    <<: *logging

  # ── Web: the HMS + Keppler OCR apps and the public entry point ───────────
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_PUBLIC_APP_URL: "${PUBLIC_URL}"
        VITE_RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      AI_SERVER_URL: "${AI_SERVER_URL:-http://host.docker.internal:8700}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [gateway, hrms, ocr-api]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *logging

volumes:
  main_postgres_data:
  hr_postgres_data:
  hr_documents:
  hrms_postgres_data:
  ocr_postgres_data:
  ocr_qdrant_data:
  ocr_uploads:
  hospital_uploads:
  ai_model_cache:
